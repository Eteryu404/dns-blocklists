name: Build DNS Blocklist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Pobieranie i agregacja list
        run: |
          mkdir -p output
          > combined_raw.txt
          
          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            echo "Pobieranie: $url"
            curl -sL --retry 3 --connect-timeout 15 "$url" >> combined_raw.txt || echo "Błąd pobierania dla $url"
          done < sources.txt

          if [ ! -s combined_raw.txt ]; then
            echo "BŁĄD: Pobrane listy są puste!"
            exit 1
          fi

          echo "Zaawansowane czyszczenie i formatowanie domen..."
          cat combined_raw.txt | \
            tr -d '\r' | \
            cut -d'#' -f1 | \
            cut -d'!' -f1 | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
            grep -v '^$' | \
            grep -v '^@@' | \
            grep -v '##' | \
            sed -E 's/^(0\.0\.0\.0|127\.0\.0\.1|::1)[[:space:]]+//' | \
            sed -E 's/\$.*$//' | \
            sed -E 's/^\|\|?//' | \
            sed -E 's/\^.*$//' | \
            sed -E 's/^\*\.//' | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
            grep -E '^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$' | \
            grep -ivE '^(localhost|local|broadcasthost|ip6-localhost|ip6-loopback|example\.com|example\.org|example\.net)$' | \
            tr '[:upper:]' '[:lower:]' | \
            sort -u > output/doh_combined.txt

          rm combined_raw.txt
          
          DOMAIN_COUNT=$(wc -l < output/doh_combined.txt)
          echo "Gotowe! Liczba unikalnych domen: $DOMAIN_COUNT"
          
          if [ "$DOMAIN_COUNT" -lt 100 ]; then
            echo "BŁĄD: Wygenerowana lista ma podejrzanie mało wpisów ($DOMAIN_COUNT). Przerywam."
            exit 1
          fi

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/doh_combined.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update combined blocklist [skip ci]" && git push)
