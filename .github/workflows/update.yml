name: Build DNS Blocklist

on:
  push:
    branches:
      - main
  schedule:
    # Złoty środek: Środa i Niedziela o 3:00 UTC
    - cron: '0 3 * * 0,3'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Pobieranie i agregacja list
        run: |
          mkdir -p output
          > combined_raw.txt
          
          touch allowlist.txt

          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            echo "Pobieranie: $url"
            
            # Pobierz do pliku tymczasowego i sprawdź status HTTP 200
            HTTP_STATUS=$(curl -sL --retry 2 --connect-timeout 10 -w "%{http_code}" -o temp_list.txt "$url" || echo "000")
            
            if [ "$HTTP_STATUS" -eq 200 ] && [ -s temp_list.txt ]; then
              cat temp_list.txt >> combined_raw.txt
              echo "" >> combined_raw.txt
            else
              echo "Ostrzeżenie: Błąd pobierania ($HTTP_STATUS) dla $url - pomijam."
            fi
            rm -f temp_list.txt
          done < sources.txt

          if [ ! -s combined_raw.txt ]; then
            echo "BŁĄD: Pobrane listy są puste!"
            exit 1
          fi

          echo "Zaawansowane czyszczenie i formatowanie domen..."
          cat combined_raw.txt | \
            tr -d '\r' | \
            cut -d'#' -f1 | \
            cut -d'!' -f1 | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
            grep -v '^$' | \
            grep -v '^@@' | \
            grep -v '##' | \
            sed -E 's/^(0\.0\.0\.0|127\.0\.0\.1|::1)[[:space:]]+//' | \
            sed -E 's/\$.*$//' | \
            sed -E 's/^\|\|?//' | \
            sed -E 's/\^.*$//' | \
            sed -E 's/^\*\.//' | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
            grep -E '^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$' | \
            grep -ivE '^(localhost|local|broadcasthost|ip6-localhost|ip6-loopback|example\.com|example\.org|example\.net)$' | \
            tr '[:upper:]' '[:lower:]' | \
            sort -u > combined_parsed.txt

          echo "Aplikowanie białej listy (allowlist.txt)..."
          grep -v -E '^[[:space:]]*$' allowlist.txt | grep -v '^[[:space:]]*#' | tr -d '\r' | tr '[:upper:]' '[:lower:]' > clean_allowlist.txt || true

          if [ -s clean_allowlist.txt ]; then
            grep -vFf clean_allowlist.txt combined_parsed.txt > output/doh_combined.txt || cp combined_parsed.txt output/doh_combined.txt
          else
            cp combined_parsed.txt output/doh_combined.txt
          fi

          rm -f combined_raw.txt combined_parsed.txt clean_allowlist.txt
          
          DOMAIN_COUNT=$(wc -l < output/doh_combined.txt)
          echo "Gotowe! Liczba unikalnych domen po uwzględnieniu allowlisty: $DOMAIN_COUNT"
          
          if [ "$DOMAIN_COUNT" -lt 100 ]; then
            echo "BŁĄD: Wygenerowana lista ma podejrzanie mało wpisów ($DOMAIN_COUNT). Przerywam."
            exit 1
          fi

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/doh_combined.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update combined blocklist [skip ci]" && git push)
