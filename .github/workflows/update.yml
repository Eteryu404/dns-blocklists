name: Build DNS Blocklist

on:
  push:
    branches:
      - main
  schedule:
    # Złoty środek: Środa i Niedziela o 3:00 UTC
    - cron: '0 3 * * 0,3'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Pobieranie i agregacja list
        run: |
          mkdir -p output
          > combined_raw.txt
          
          touch allowlist.txt

          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            echo "Pobieranie: $url"
            
            HTTP_STATUS=$(curl -sL --retry 2 --connect-timeout 10 -w "%{http_code}" -o temp_list.txt "$url" || echo "000")
            
            if [ "$HTTP_STATUS" -eq 200 ] && [ -s temp_list.txt ]; then
              cat temp_list.txt >> combined_raw.txt
              echo "" >> combined_raw.txt
            else
              echo "Ostrzeżenie: Błąd pobierania ($HTTP_STATUS) dla $url - pomijam."
            fi
            rm -f temp_list.txt
          done < sources.txt

          if [ ! -s combined_raw.txt ]; then
            echo "BŁĄD: Pobrane listy są puste!"
            exit 1
          fi

          echo "Czyszczenie, formatowanie i aglomeracja subdomen przez Python..."
          python3 - << 'EOF'
          import re

          raw_file = "combined_raw.txt"
          allowlist_file = "allowlist.txt"
          output_file = "output/doh_combined.txt"

          # 1. Wczytaj i wyczyść allowlistę
          allowlist = set()
          try:
              with open(allowlist_file, "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      line = line.strip().lower()
                      if line and not line.startswith("#"):
                          allowlist.add(line)
          except FileNotFoundError:
              pass

          # 2. Parsuj surowe domeny z list
          domains = set()
          domain_pattern = re.compile(r'^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$')
          ignored = {'localhost', 'local', 'broadcasthost', 'ip6-localhost', 'ip6-loopback', 'example.com', 'example.org', 'example.net'}

          with open(raw_file, "r", encoding="utf-8", errors="ignore") as f:
              for line in f:
                  # Usuń komentarze, białe znaki, formatowania hosts / adblock
                  line = line.split('#')[0].split('!')[0].strip().lower()
                  line = re.sub(r'^(0\.0\.0\.0|127\.0\.0\.1|::1)\s+', '', line)
                  line = re.sub(r'\$.*$', '', line)
                  line = re.sub(r'^\|\|?', '', line)
                  line = re.sub(r'\^.*$', '', line)
                  line = re.sub(r'^\*\.', '', line)
                  line = line.strip()

                  if not line or line in ignored:
                      continue
                  
                  # Sprawdź poprawność domeny
                  if domain_pattern.match(line):
                      if line not in allowlist:
                          domains.add(line)

          # 3. Aglomeracja subdomen (usuwanie zbędnych dzieci, jeśli rodzic jest już blokowany)
          # Sortujemy domeny od najkrótszych (rodzice) do najdłuższych (poddomeny)
          sorted_domains = sorted(domains, key=len)
          optimized_domains = set()
          seen_parents = set()

          for d in sorted_domains:
              parts = d.split('.')
              is_redundant = False
              # Sprawdź czy jakikolwiek rodzic (np. example.com dla a.b.example.com) jest już zablokowany
              for i in range(1, len(parts)):
                  parent = '.'.join(parts[i:])
                  if parent in seen_parents:
                      is_redundant = True
                      break
              
              if not is_redundant:
                  optimized_domains.add(d)
                  seen_parents.add(d)

          # 4. Zapisz wynik
          with open(output_file, "w", encoding="utf-8") as f:
              for d in sorted(optimized_domains):
                  f.write(d + "\n")

          print(f"Zoptymalizowano! Liczba unikalnych domen po aglomeracji: {len(optimized_domains)}")
          EOF

          # Sprawdź czy plik wynikowy istnieje i nie jest pusty
          if [ ! -s output/doh_combined.txt ]; then
            echo "BŁĄD: Wygenerowany plik wynikowy jest pusty!"
            exit 1
          fi

          rm -f combined_raw.txt
          
          DOMAIN_COUNT=$(wc -l < output/doh_combined.txt)
          echo "Gotowe! Końcowa liczba domen: $DOMAIN_COUNT"
          
          if [ "$DOMAIN_COUNT" -lt 100 ]; then
            echo "BŁĄD: Wygenerowana lista ma podejrzanie mało wpisów ($DOMAIN_COUNT). Przerywam."
            exit 1
          fi

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/doh_combined.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update and optimize blocklist [skip ci]" && git push)
